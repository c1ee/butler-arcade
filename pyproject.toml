[project]
name = "gettogether"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "arcadepy>=1.10.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
butler = "butler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["butler"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # `uv run pytest evals` runs the live evals
